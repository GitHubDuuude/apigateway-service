server:
  port: 8080

spring:
  application:
    name: apigateway-service
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: identity-access-service
              uri: lb://identity-access-service
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2

            - id: salas-service
              uri: lb://salas-service
              predicates:
                - Path=/api/salas/**
              filters:
                - StripPrefix=2

            - id: sixseven-service
              uri: lb://sixseven-service
              predicates:
                - Path=/api/sixseven/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Identity Access
        url: /api/identity/api-docs.json
      - name: Salas
        url: /api/salas/v3/api-docs
      - name: SixSeven
        url: /api/sixseven/openapi/v1.json