server:
  port: 8080

spring:
  application:
    name: apigateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-access-service
              uri: lb://identity-access-service
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2

            - id: salas-service
              uri: lb://salas-service
              predicates:
                - Path=/api/salas/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Identity Access
        url: /api/identity/v3/api-docs
      - name: Salas
        url: /api/salas/v3/api-docs